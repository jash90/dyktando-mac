name: Dyktando
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.5.0"
options:
  bundleIdPrefix: com.bartekzimny
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release: {}
targets:
  Dyktando:
    type: application
    platform: macOS
    sources:
      - path: Dyktando
    info:
      path: Dyktando/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Dyktando
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Dyktando uses your microphone to transcribe speech into text. Audio never leaves your Mac."
        NSSpeechRecognitionUsageDescription: "Dyktando uses speech recognition (on-device) to transcribe your voice."
    dependencies:
      - package: KeyboardShortcuts
      - package: WhisperKit
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartekzimny.dyktando
        SWIFT_OBJC_BRIDGING_HEADER: ""
  DyktandoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DyktandoTests
    dependencies:
      - target: Dyktando
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dyktando.app/Contents/MacOS/Dyktando"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dyktando:
    build:
      targets:
        Dyktando: all
        DyktandoTests: [test]
    test:
      targets: [DyktandoTests]
    run:
      config: Debug
    archive:
      config: Release
