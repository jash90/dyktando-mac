name: Dyktando
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.5.0"
options:
  bundleIdPrefix: com.bartekzimny
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release: {}
targets:
  Dyktando:
    type: application
    platform: macOS
    sources:
      - path: Dyktando
      # Serwer MLX (Canary / Whisper) — kopiowany do Application Support przy instalacji modelu.
      # Pojedyncze pliki, nie cały folder: sidecar/.venv (deweloperski) nie może trafić do paczki.
      - path: sidecar/stt_server.py
        buildPhase: resources
      - path: sidecar/pyproject.toml
        buildPhase: resources
      - path: sidecar/uv.lock
        buildPhase: resources
    info:
      path: Dyktando/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Dyktando
        CFBundleShortVersionString: "0.2.4"
        CFBundleVersion: "6"
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Dyktando uses your microphone to transcribe speech into text. Audio never leaves your Mac."
        NSSpeechRecognitionUsageDescription: "Dyktando uses speech recognition (on-device) to transcribe your voice."
    dependencies:
      - package: KeyboardShortcuts
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartekzimny.dyktando
        CODE_SIGN_ENTITLEMENTS: Dyktando/Dyktando.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DyktandoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DyktandoTests
    dependencies:
      - target: Dyktando
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dyktando.app/Contents/MacOS/Dyktando"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dyktando:
    build:
      targets:
        Dyktando: all
        DyktandoTests: [test]
    test:
      targets: [DyktandoTests]
    run:
      config: Debug
    archive:
      config: Release
